                - generic [ref=e134]:
                  - paragraph [ref=e135]: Ransom Note is an online music, arts and culture magazine. We provide a home for readers and writers with boundless enthusiasm, esoteric knowledge, fierce opinions and impeccable taste.
                  - paragraph [ref=e136]: With our core team immersed in all aspects of dance music, we publish news, articles, and interviews covering the greatest in innovative, underground culture from across the globe. We offer regular, exclusive music and mixtapes from our favourite artists, and publish features shining a light on everything from the freshest new artists to the untold tales from rave history.
                  - paragraph [ref=e137]: Alongside this we offer musings on film, books, life, and art, generating some context and controversy as an antidote to the reheated PR that clogs up the internet. Our office is fuelled by Tunnock’s Bars, cat memes, hangovers and a ridiculous, never ending love for our culture.
                  - paragraph [ref=e138]: We're always interested in getting new writers on board – feel free to get in touch if you’ve got a story to tell.
                  - paragraph [ref=e139]: With love until the grave.
