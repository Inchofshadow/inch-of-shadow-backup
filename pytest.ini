[pytest]
# Bare `pytest` from the repo root runs the real suite only (gate review 2026-11-08):
# (music-tools/drumrack/tests/test_detect_type.py is a script that exits on import, run it by hand.)
# archive/ holds parked code whose tests no longer import, .venv/ holds site-packages.
testpaths = tests
norecursedirs = archive .venv .claude .git node_modules
