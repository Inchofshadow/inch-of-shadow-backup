<title>Rate Card Bottom Picks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one column of big option tiles, tap a tile to zoom, V tick under each. Single light look on purpose (matches the airy card). */
  :root {
    --bg: #F4F1EC; --fg: #0F0D0C; --soft: #6E6862; --tile: #FBFAF7; --edge: #E4DFD6; --pick: #2F5D3A; --pick-bg: #E3ECE2;
    --display: "Marcellus", Georgia, serif; --body: "Jost", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-weight: 300; font-size: 16px; line-height: 1.5;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; margin: 0; text-wrap: balance; }
  .lead { color: var(--soft); margin: 10px 0 28px; max-width: 62ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; }
  .card { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .shot { display: block; width: 100%; padding: 0; border: 1px solid var(--edge); background: var(--tile); cursor: zoom-in; border-radius: 2px; }
  .shot img { display: block; width: 100%; height: auto; }
  .shot:focus-visible, .tick:focus-visible, .lb button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .name { display: flex; gap: 10px; align-items: baseline; }
  .num { font-family: var(--display); font-size: 28px; line-height: 1; }
  .what { font-weight: 400; font-size: 15px; }
  .why { color: var(--soft); font-size: 14px; margin: 0; }
  .tick { align-self: flex-start; font: 400 15px var(--body); letter-spacing: 0.04em; padding: 9px 18px; border: 1px solid var(--fg);
          background: transparent; color: var(--fg); cursor: pointer; border-radius: 999px; }
  .tick[aria-pressed="true"] { background: var(--pick); border-color: var(--pick); color: #fff; }
  .card.picked .shot { border-color: var(--pick); box-shadow: 0 0 0 3px var(--pick-bg); }
  .status { color: var(--soft); font-size: 13px; margin-top: 26px; }

  .lb { position: fixed; inset: 0; background: rgba(15, 13, 12, 0.92); display: flex; align-items: center; justify-content: center; z-index: 20;
        padding: calc(env(safe-area-inset-top, 0px) + 48px) max(56px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 48px) max(56px, env(safe-area-inset-left, 0px)); }
  .lb img { max-width: 100%; max-height: 100%; object-fit: contain; background: var(--tile); }
  .lb button { position: absolute; background: transparent; border: 0; color: #F4F1EC; font: 300 40px var(--body); cursor: pointer; padding: 8px 14px; }
  .lb .prev { left: max(4px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); }
  .lb .next { right: max(4px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); }
  .lb .close { right: max(8px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 4px); font-size: 30px; }
  .lb .cap { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); text-align: center; color: #F4F1EC; font-size: 14px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Marcellus&display=swap">

<div class="wrap">
  <h1>Rate card: the bottom block</h1>
  <p class="lead">Four ways to organise revisions, payment, delivery, express, discounts and files. Same facts in each, prices untouched. Tap a page to zoom and slide between them. Tick V on the one to keep.</p>
  <div class="grid" id="grid"></div>
  <p class="status" id="status">Loading your ticks…</p>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Zoomed option">
  <button class="close" id="lbClose" aria-label="Close">×</button>
  <button class="prev" id="lbPrev" aria-label="Previous option">‹</button>
  <img id="lbImg" alt="">
  <button class="next" id="lbNext" aria-label="Next option">›</button>
  <div class="cap" id="lbCap"></div>
</div>

<script>
const OPTIONS = [
  { id: "opt1", n: 1, what: "Spec sheet", why: "Label left, text right, one fact per row. Calm and easy to scan.", img: "__IMG1__" },
  { id: "opt2", n: 2, what: "How it works", why: "Four numbered steps in the order a client goes through them: files, pay half, 10 days, pay half.", img: "__IMG2__" },
  { id: "opt3", n: 3, what: "Big numbers", why: "2, 10, 50/50, 48h set large. Files and discounts in one small line.", img: "__IMG3__" },
  { id: "opt4", n: 4, what: "Included / Good to know", why: "Two groups: what the price includes, and the practical terms.", img: "__IMG4__" },
];
const picks = {};
let db = null, current = 0;
const grid = document.getElementById("grid"), statusEl = document.getElementById("status");

function render() {
  grid.innerHTML = "";
  OPTIONS.forEach((o, i) => {
    const on = picks[o.id] === "yes";
    const card = document.createElement("div");
    card.className = "card" + (on ? " picked" : "");
    card.innerHTML = `<button class="shot" aria-label="Zoom option ${o.n}"><img alt="Rate card, option ${o.n}: ${o.what}"></button>
      <div class="name"><span class="num">${o.n}</span><span class="what"></span></div>
      <p class="why"></p>
      <button class="tick" aria-pressed="${on}">${on ? "V picked" : "Tick V"}</button>`;
    card.querySelector("img").src = o.img;
    card.querySelector(".what").textContent = o.what;
    card.querySelector(".why").textContent = o.why;
    card.querySelector(".shot").onclick = () => openLb(i);
    card.querySelector(".tick").onclick = () => toggle(o.id);
    grid.appendChild(card);
  });
}

async function toggle(id) {
  const next = picks[id] === "yes" ? "no" : "yes";
  picks[id] = next; render();
  if (!db) { statusEl.textContent = "Saving is not available in this view. Tell Claude your number in chat."; return; }
  try {
    await db.doc("ticks/" + id).set({ name: OPTIONS.find(o => o.id === id).what, pick: next, at: new Date().toISOString() });
    statusEl.textContent = "Saved. Claude reads your ticks from here.";
  } catch (e) {
    statusEl.textContent = "Could not save (" + (e && e.code ? e.code : "error") + "). Tell Claude your number in chat.";
  }
}

const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbCap = document.getElementById("lbCap");
function openLb(i) { current = i; showLb(); lb.hidden = false; document.getElementById("lbClose").focus(); }
function showLb() { const o = OPTIONS[current]; lbImg.src = o.img; lbImg.alt = "Option " + o.n; lbCap.textContent = o.n + "  " + o.what; }
function step(d) { current = (current + d + OPTIONS.length) % OPTIONS.length; showLb(); }
document.getElementById("lbPrev").onclick = () => step(-1);
document.getElementById("lbNext").onclick = () => step(1);
document.getElementById("lbClose").onclick = () => { lb.hidden = true; };
lb.addEventListener("click", e => { if (e.target === lb) lb.hidden = true; });
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1); else if (e.key === "Escape") lb.hidden = true;
});
let sx = null;
lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); sx = null; });

render();
(async () => {
  const timer = setTimeout(() => { statusEl.textContent = "Ticks could not load. You can still tell Claude your number in chat."; }, 10000);
  try {
    db = await window.claude?.use?.("db");
    if (!db) { clearTimeout(timer); statusEl.textContent = "Saving is not available in this view. Tell Claude your number in chat."; return; }
    db.collection("ticks").onSnapshot(snap => {
      clearTimeout(timer);
      snap.docs.forEach(d => { const v = d.data(); if (v && v.pick) picks[d.id] = v.pick; });
      render();
      statusEl.textContent = "Tick V on the one to keep. Saved here, Claude reads it.";
    }, () => { clearTimeout(timer); statusEl.textContent = "Ticks could not load. You can still tell Claude your number in chat."; });
  } catch (e) { clearTimeout(timer); statusEl.textContent = "Saving is not available in this view. Tell Claude your number in chat."; }
})();
</script>
